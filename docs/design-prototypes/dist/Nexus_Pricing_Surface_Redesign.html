<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus · Pricing Surface Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="app/r6/styles.css" />
<link rel="stylesheet" href="app/pricing_surface/styles.css" />
</head>
<body>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <rect width="400" height="400" fill="oklch(0.97 0.012 85)"/>
    <g transform="translate(120 120)">
      <rect width="160" height="160" rx="20" fill="oklch(0.42 0.14 255)"/>
      <text x="80" y="100" font-family="Georgia, serif" font-style="italic" font-size="40" font-weight="500" fill="oklch(0.97 0.012 85)" text-anchor="middle">Pricing</text>
    </g>
    <text x="200" y="332" font-family="Georgia, serif" font-size="20" fill="oklch(0.35 0.02 250)" text-anchor="middle" font-style="italic">surface redesign</text>
  </svg>
</template>

<div id="root"></div>

<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "scenario": "s11_post_surgical_applied"
  }/*EDITMODE-END*/;
  window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/pricing_surface/classifier.js"></script>
<script src="app/pricing_surface/data.js"></script>
<script type="text/babel" src="app/r6/cost-stack.jsx"></script>
<script type="text/babel" src="app/pricing_surface/pricing_surface.jsx"></script>

<script type="text/babel">
const { useState: useStateRoot, useEffect: useEffectRoot } = React;

function Root() {
  const [tweaks, setTweaks] = useStateRoot(window.TWEAK_DEFAULTS || { theme: "light", scenario: "s01_sendable_vanilla" });
  useEffectRoot(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme || "light");
  }, [tweaks.theme]);
  const setTweak = (k, v) => setTweaks(prev => {
    const next = { ...prev, [k]: v };
    try { window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*"); } catch (e) {}
    return next;
  });
  return (
    <div className="psr-shell">
      <window.PSR.ScenarioStrip
        scenarioKey={tweaks.scenario}
        onChange={s => setTweak("scenario", s)}
        theme={tweaks.theme}
        onTheme={() => setTweak("theme", tweaks.theme === "dark" ? "light" : "dark")}
      />
      <window.PSR.App scenarioKey={tweaks.scenario} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

</body>
</html>
