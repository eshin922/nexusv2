<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus · Round 8 — Quote umbrella (5-sub-tab reversible lifecycle)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="app/r8/styles.css" />
</head>
<body>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <rect width="400" height="400" fill="oklch(0.97 0.012 85)"/>
    <g transform="translate(52 150)">
      <rect x="0"   y="0" width="46" height="46" rx="23" fill="oklch(0.72 0.10 150)"/>
      <rect x="60"  y="0" width="46" height="46" rx="23" fill="oklch(0.72 0.10 150)"/>
      <rect x="120" y="0" width="46" height="46" rx="8"  fill="oklch(0.45 0.12 250)"/>
      <rect x="180" y="0" width="46" height="46" rx="23" fill="oklch(0.86 0.012 90)"/>
      <line x1="246" y1="-10" x2="246" y2="56" stroke="oklch(0.60 0.014 255)" stroke-width="2" stroke-dasharray="5 5"/>
      <rect x="258" y="0" width="46" height="46" rx="8" fill="oklch(0.26 0.02 255)"/>
      <text x="281" y="31" font-family="Georgia, serif" font-size="22" fill="oklch(0.96 0.01 90)" text-anchor="middle">🔒</text>
    </g>
    <text x="200" y="266" font-family="Georgia, serif" font-size="24" fill="oklch(0.30 0.02 250)" text-anchor="middle">R8 · Quote umbrella</text>
    <text x="200" y="294" font-family="Georgia, serif" font-size="17" font-style="italic" fill="oklch(0.50 0.02 250)" text-anchor="middle">reversible until the lock</text>
  </svg>
</template>

<div id="root"></div>

<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "tab": "review",
    "variant": "feed",
    "narrow": false
  }/*EDITMODE-END*/;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script src="app/r8/data.js"></script>
<script type="text/babel" src="app/r8/umbrella.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TABS = [
  { value: "preview",  label: "1 · Preview Quote" },
  { value: "send",     label: "2 · Send to Client" },
  { value: "review",   label: "3 · Client Review" },
  { value: "accepted", label: "4 · Mark Accepted" },
  { value: "tier",     label: "5 · Tier Selection" },
];

function Root() {
  const [tweaks, setTweaks] = useState(window.TWEAK_DEFAULTS || { theme: "light", tab: "review", variant: "feed", narrow: false });

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme || "light");
  }, [tweaks.theme]);

  const setTweak = (k, v) => setTweaks(prev => {
    const edits = typeof k === "object" ? k : { [k]: v };
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits }, "*");
    return { ...prev, ...edits };
  });

  const variantsFor = t => ({
    preview:  [{ value: "default", label: "Default" }],
    send:     [{ value: "ready", label: "Ready to send" }, { value: "waiting", label: "Sent · awaiting" }],
    review:   [{ value: "feed", label: "Feed + mismatch" }, { value: "empty", label: "Empty" }],
    accepted: [{ value: "ready", label: "Ready" }, { value: "pushing", label: "HubSpot pushing" }, { value: "confirmed", label: "Confirmed" }, { value: "error", label: "Push failed" }],
    tier:     [{ value: "select", label: "Select tier" }, { value: "pushing", label: "Pushing SO" }, { value: "error", label: "Push failed" }, { value: "complete", label: "Complete · locked" }],
  })[t] || [{ value: "default", label: "Default" }];

  return (
    <div className="r8-root">
      <window.QuoteUmbrella tweaks={tweaks} setTweak={setTweak} />
      <window.TweaksPanel title="R8 · Quote umbrella">
        <window.TweakSection label="Prototype navigation" />
        <window.TweakSelect
          label="Sub-tab"
          value={tweaks.tab}
          options={TABS}
          onChange={v => setTweak({ tab: v, variant: variantsFor(v)[0].value })}
        />
        <window.TweakSelect
          label="State"
          value={tweaks.variant}
          options={variantsFor(tweaks.tab)}
          onChange={v => setTweak("variant", v)}
        />
        <window.TweakSection label="Deliverable 5 · viewport" />
        <window.TweakToggle
          label="Stacked / narrow variant"
          value={!!tweaks.narrow}
          onChange={v => setTweak("narrow", v)}
        />
        <window.TweakSection label="Preview" />
        <window.TweakRadio
          label="Theme"
          value={tweaks.theme}
          options={[{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }]}
          onChange={v => setTweak("theme", v)}
        />
      </window.TweaksPanel>
    </div>
  );
}

window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

</body>
</html>
