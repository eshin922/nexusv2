<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus · Round 7b — Setup redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="app/r4/styles.css" />
<link rel="stylesheet" href="app/r7b/styles.css" />
</head>
<body>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <rect width="400" height="400" fill="oklch(0.97 0.012 85)"/>
    <g transform="translate(120 120)">
      <rect width="160" height="160" rx="20" fill="oklch(0.45 0.12 250)"/>
      <text x="80" y="100" font-family="Georgia, serif" font-size="56" font-weight="500" fill="oklch(0.97 0.012 85)" text-anchor="middle">R7b</text>
    </g>
    <text x="200" y="332" font-family="Georgia, serif" font-size="20" fill="oklch(0.35 0.02 250)" text-anchor="middle" font-style="italic">Setup</text>
  </svg>
</template>

<div id="root"></div>

<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "openSkuId": null,
    "tiersEmpty": true
  }/*EDITMODE-END*/;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/r7b/data.js"></script>
<script type="text/babel" src="app/r7b/setup.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;
function Root() {
  const [tweaks, setTweaks] = useState(window.TWEAK_DEFAULTS || { theme: "light", openSkuId: null, tiersEmpty: false });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme || "light");
  }, [tweaks.theme]);
  const setTweak = (k, v) => setTweaks(prev => {
    const next = { ...prev, [k]: v };
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
    return next;
  });
  return (
    <div className="r4-shell" style={{ display: "grid", gridTemplateColumns: "56px 240px 1fr", minHeight: "100vh" }}>
      <window.NXR7BOuterRail />
      <window.NXR7BInnerRail />
      <main style={{ overflow: "hidden", minWidth: 0 }}>
        <div className="r7b-state-strip">
          <span className="lbl">R7b states</span>
          <button className={!tweaks.openSkuId && !tweaks.tiersEmpty ? "active" : ""}
                  onClick={() => { setTweak("openSkuId", null); setTweak("tiersEmpty", false); }}>
            ① All collapsed
          </button>
          <button className={tweaks.openSkuId === "sku_glw30" ? "active" : ""}
                  onClick={() => { setTweak("openSkuId", "sku_glw30"); setTweak("tiersEmpty", false); }}>
            ② Assembly drawer open
          </button>
          <button className={tweaks.openSkuId === "sku_rpl200" ? "active" : ""}
                  onClick={() => { setTweak("openSkuId", "sku_rpl200"); setTweak("tiersEmpty", false); }}>
            ③ Leaf drawer open
          </button>
          <button className={tweaks.tiersEmpty ? "active" : ""}
                  onClick={() => { setTweak("openSkuId", null); setTweak("tiersEmpty", true); }}>
            ④ Empty tiers (preset picker)
          </button>
          <span className="right">
            <a href="Nexus Round 7a.html">← R7a Nav IA</a>
            <a href="docs/r7b-data-source-map.md">Data-source map</a>
            <a href="docs/r7b-designer-notes.md">Designer notes</a>
          </span>
        </div>

        <window.NXR7BPage tweaks={tweaks} />
      </main>
    </div>
  );
}
// Export the rails so setup.jsx can be lean
window.NXR7BOuterRail = (() => {
  const D = window.NXR7B;
  return function OuterRail() {
    return (
      <nav className="r4-outer">
        <div className="r4-outer-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
            <path d="M4 19V5l16 14V5" />
          </svg>
        </div>
        <div className="r4-outer-section">
          <button className="r4-outer-btn active" title="My deals">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
              <rect x="3" y="4" width="18" height="4" rx="1" />
              <rect x="3" y="11" width="18" height="4" rx="1" />
              <rect x="3" y="18" width="18" height="3" rx="1" />
            </svg>
          </button>
        </div>
        <div className="r4-outer-section">
          <span className="r4-outer-label">Pinned</span>
          <div className="r4-recent blue active" title={D.project.client}>
            {D.project.client.split(/\s/).map(w => w[0]).join("").slice(0,2)}
            <span className="pin">·</span>
          </div>
          <div className="r4-recent amber">BF</div>
        </div>
        <div className="r4-outer-section">
          <span className="r4-outer-label">Recent</span>
          <div className="r4-recent violet">AC</div>
          <div className="r4-recent teal">MA</div>
        </div>
        <div className="r4-outer-foot">
          <div className="r4-outer-avatar">{D.me.initials}</div>
        </div>
      </nav>
    );
  };
})();
window.NXR7BInnerRail = (() => {
  const D = window.NXR7B;
  return function InnerRail() {
    return (
      <aside className="r4-inner">
        <button className="r4-inner-back">← All deals</button>
        <div className="r4-inner-project">
          <div className="client">{D.project.client}</div>
          <div className="deal">{D.project.deal_name}</div>
          <div className="meta">
            <span>{D.project.hubspot_stage.toUpperCase()}</span>
            <span>·</span>
            <span>SYNCED {D.project.hubspot_synced_at}</span>
          </div>
        </div>
        <div className="r4-inner-section">
          <h6>Scenarios <span className="add">+ New</span></h6>
          <div className="r4-scenario active">
            <div className="row">
              <div className="label">{D.scenario.label}</div>
              <div className="v">v{D.scenario.version}</div>
            </div>
            <div className="meta">
              <span className="pip warn" />
              <span>draft after send</span>
            </div>
            <div style={{ marginTop: 6, marginLeft: -6, marginRight: -6 }}>
              <div className="r4-surf active">Setup</div>
              <div className="r4-surf">Cost build</div>
              <div className="r4-surf">Costing sheet</div>
              <div className="r4-surf">Customer view</div>
              <div className="r4-surf">Mark Accepted</div>
            </div>
          </div>
        </div>
      </aside>
    );
  };
})();
window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

</body>
</html>
