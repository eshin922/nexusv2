<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus · Round 9 — Acceptance &amp; Tier Commitment ceremony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<!-- R8 canonical stylesheet — merged & shipping, UNCHANGED -->
<link rel="stylesheet" href="app/r8/styles.css" />
<!-- R9 addendum — adds sub-tabs 4+5, overrides four rules (documented in-file) -->
<link rel="stylesheet" href="app/r9/styles.css" />
</head>
<body>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <rect width="400" height="400" fill="oklch(0.97 0.012 85)"/>
    <g transform="translate(74 152)">
      <rect x="0" y="0" width="104" height="44" rx="8" fill="oklch(0.86 0.06 240)"/>
      <text x="52" y="29" font-family="Georgia, serif" font-size="17" fill="oklch(0.30 0.04 250)" text-anchor="middle">accept</text>
      <path d="M112 22 L136 22 M130 16 L136 22 L130 28" stroke="oklch(0.45 0.02 255)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="148" y1="-8" x2="148" y2="52" stroke="oklch(0.26 0.02 255)" stroke-width="2"/>
      <rect x="160" y="0" width="104" height="44" rx="6" fill="oklch(0.26 0.02 255)"/>
      <text x="212" y="29" font-family="Georgia, serif" font-size="17" fill="oklch(0.96 0.01 90)" text-anchor="middle">🔒 commit</text>
    </g>
    <text x="200" y="262" font-family="Georgia, serif" font-size="23" fill="oklch(0.30 0.02 250)" text-anchor="middle">R9 · Acceptance ceremony</text>
    <text x="200" y="290" font-family="Georgia, serif" font-size="16" font-style="italic" fill="oklch(0.50 0.02 250)" text-anchor="middle">one decision, one capture, one lock</text>
  </svg>
</template>

<div id="root"></div>

<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "tab": "accepted",
    "variant": "capture",
    "narrow": false
  }/*EDITMODE-END*/;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<!-- R8 fixtures + components: sub-tabs 1–3, strip, advance bar are reused verbatim -->
<script src="app/r8/data.js"></script>
<script type="text/babel" src="app/r8/umbrella.jsx"></script>
<!-- R9: revised sub-tab 4 (capture) + new sub-tab 5 (lock) -->
<script src="app/r9/data.js"></script>
<script type="text/babel" src="app/r9/ceremony.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TABS = [
  { value: "preview",  label: "1 · Preview Quote (R8)" },
  { value: "send",     label: "2 · Send to Client (R8)" },
  { value: "review",   label: "3 · Client Review (R8)" },
  { value: "accepted", label: "4 · Acceptance — revised" },
  { value: "tier",     label: "5 · Tier commitment — new" },
];

function Root() {
  const [tweaks, setTweaks] = useState(window.TWEAK_DEFAULTS || { theme: "light", tab: "accepted", variant: "capture", narrow: false });

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme || "light");
  }, [tweaks.theme]);

  const setTweak = (k, v) => setTweaks(prev => {
    const edits = typeof k === "object" ? k : { [k]: v };
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits }, "*");
    return { ...prev, ...edits };
  });

  const variantsFor = t =>
    (window.VARIANTS9[t] || [{ id: "default", label: "Default" }]).map(v => ({ value: v.id, label: v.label }));

  return (
    <div className="r9-root">
      <window.QuoteUmbrellaR9 tweaks={tweaks} setTweak={setTweak} />
      <window.TweaksPanel title="R9 · Acceptance ceremony">
        <window.TweakSection label="Prototype navigation" />
        <window.TweakSelect
          label="Sub-tab"
          value={tweaks.tab}
          options={TABS}
          onChange={v => setTweak({ tab: v, variant: window.VARIANTS9[v][0].id })}
        />
        <window.TweakSelect
          label="State"
          value={tweaks.variant}
          options={variantsFor(tweaks.tab)}
          onChange={v => setTweak("variant", v)}
        />
        <window.TweakSection label="Viewport" />
        <window.TweakToggle
          label="Stacked / narrow variant"
          value={!!tweaks.narrow}
          onChange={v => setTweak("narrow", v)}
        />
        <window.TweakSection label="Preview" />
        <window.TweakRadio
          label="Theme"
          value={tweaks.theme}
          options={[{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }]}
          onChange={v => setTweak("theme", v)}
        />
      </window.TweaksPanel>
    </div>
  );
}

window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

</body>
</html>
