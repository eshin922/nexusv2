<style>/* Nexus — Quoting Flow concepts */

:root {
  /* Paper palette */
  --paper: oklch(0.985 0.006 85);
  --paper-2: oklch(0.965 0.008 85);
  --paper-3: oklch(0.945 0.010 85);
  --rule: oklch(0.88 0.012 85);
  --rule-2: oklch(0.82 0.014 85);

  /* Ink palette */
  --ink: oklch(0.20 0.02 255);
  --ink-2: oklch(0.36 0.02 255);
  --ink-3: oklch(0.52 0.015 255);
  --ink-4: oklch(0.68 0.012 255);

  /* Accent — a single confident ink-blue */
  --accent: oklch(0.42 0.14 255);
  --accent-soft: oklch(0.92 0.04 255);
  --accent-ink: oklch(0.28 0.12 255);

  /* Semantic — restrained, not candy */
  --good: oklch(0.55 0.10 155);
  --good-soft: oklch(0.94 0.035 155);
  --warn: oklch(0.62 0.13 70);
  --warn-soft: oklch(0.94 0.05 70);
  --bad: oklch(0.55 0.18 25);
  --bad-soft: oklch(0.94 0.04 25);

  /* Internal-only marker */
  --internal: oklch(0.55 0.06 300);
  --internal-soft: oklch(0.95 0.02 300);

  /* Type */
  --display: "Newsreader", Georgia, serif;
  --ui: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;

  --shadow-sm: 0 1px 0 oklch(0.88 0.012 85), 0 1px 2px oklch(0.20 0.02 255 / 0.04);
  --shadow-md: 0 1px 0 oklch(0.88 0.012 85), 0 8px 24px oklch(0.20 0.02 255 / 0.06);
  --shadow-lg: 0 24px 60px oklch(0.20 0.02 255 / 0.12);
}

[data-theme="dark"] {
  --paper: oklch(0.18 0.012 255);
  --paper-2: oklch(0.21 0.013 255);
  --paper-3: oklch(0.245 0.014 255);
  --rule: oklch(0.30 0.014 255);
  --rule-2: oklch(0.36 0.016 255);

  --ink: oklch(0.96 0.008 85);
  --ink-2: oklch(0.84 0.010 85);
  --ink-3: oklch(0.68 0.012 85);
  --ink-4: oklch(0.52 0.014 85);

  --accent: oklch(0.78 0.13 250);
  --accent-soft: oklch(0.30 0.06 250);
  --accent-ink: oklch(0.88 0.10 250);

  --good: oklch(0.78 0.13 155);
  --good-soft: oklch(0.30 0.05 155);
  --warn: oklch(0.82 0.13 75);
  --warn-soft: oklch(0.32 0.05 70);
  --bad: oklch(0.74 0.16 25);
  --bad-soft: oklch(0.34 0.06 25);

  --internal: oklch(0.78 0.08 300);
  --internal-soft: oklch(0.28 0.04 300);

  --shadow-sm: 0 1px 0 oklch(0.30 0.014 255), 0 1px 2px oklch(0 0 0 / 0.4);
  --shadow-md: 0 1px 0 oklch(0.30 0.014 255), 0 8px 24px oklch(0 0 0 / 0.5);
  --shadow-lg: 0 24px 60px oklch(0 0 0 / 0.6);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper-2);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.005em;
}

button { font-family: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }

/* ─── Shell ─────────────────────────────────────────── */
.shell {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

/* ─── Sidebar ──────────────────────────────────────── */
.sidebar {
  background: var(--paper);
  border-right: 1px solid var(--rule);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 4px 8px;
}
.brand .mark {
  width: 22px; height: 22px;
  color: var(--ink);
  align-self: center;
  display: block;
}
.brand .name {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.brand .ver {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.side-section {
  display: flex; flex-direction: column; gap: 2px;
}
.side-section h6 {
  margin: 0 8px 6px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.side-link {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 8px;
  border-radius: 6px;
  color: var(--ink-2);
  font-size: 13.5px;
  cursor: pointer;
  transition: background 120ms;
  border: none; background: transparent; text-align: left; width: 100%;
}
.side-link:hover { background: var(--paper-2); color: var(--ink); }
.side-link.active { background: var(--paper-3); color: var(--ink); font-weight: 500; }
.side-link .glyph { width: 14px; text-align: center; color: var(--ink-3); font-family: var(--mono); }
.side-link .badge {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  background: var(--paper-2);
  padding: 1px 5px;
  border-radius: 3px;
}

.side-foot {
  margin-top: auto;
  padding: 12px 8px;
  border-top: 1px solid var(--rule);
  display: flex; align-items: center; gap: 8px;
  font-size: 12px;
  color: var(--ink-3);
}
.avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-ink);
  display: grid; place-items: center;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0;
  flex-shrink: 0;
}
.avatar.sm { width: 20px; height: 20px; font-size: 9.5px; }
.avatar.xs { width: 16px; height: 16px; font-size: 8px; }
.avatar.md { width: 32px; height: 32px; font-size: 12px; }
.avatar.lg { width: 44px; height: 44px; font-size: 14px; }

/* ─── Main scroll area ─────────────────────────────── */
.main { display: flex; flex-direction: column; min-width: 0; }

/* ─── Top bar ──────────────────────────────────────── */
.topbar {
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  padding: 0 32px;
  display: flex; align-items: center; gap: 16px;
  height: 56px;
  position: sticky; top: 0; z-index: 10;
}
.crumbs {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
  color: var(--ink-3);
}
.crumbs .sep { color: var(--ink-4); }
.crumbs .here { color: var(--ink); font-weight: 500; }
.crumbs a { color: var(--ink-3); }
.crumbs a:hover { color: var(--ink); }

.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.presence { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.presence .dots { display: flex; }
.presence .dots .avatar { margin-left: -4px; border: 2px solid var(--paper); }
.presence .live {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 3px var(--good-soft);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ─── Buttons ──────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  border-radius: 6px;
  border: 1px solid var(--rule-2);
  background: var(--paper);
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--ui);
  cursor: pointer;
  transition: all 120ms;
}
.btn:hover { background: var(--paper-2); border-color: var(--ink-4); }
.btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.accent {
  background: var(--accent);
  color: var(--paper);
  border-color: var(--accent);
}
.btn.ghost {
  background: transparent;
  border-color: transparent;
  color: var(--ink-2);
}
.btn.ghost:hover { background: var(--paper-2); color: var(--ink); }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn .glyph { font-family: var(--mono); font-size: 11px; opacity: 0.7; }

/* ─── Page content ─────────────────────────────────── */
.page { padding: 32px 32px 80px; max-width: 1400px; }

.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px; margin-bottom: 24px;
}
.page-title {
  font-family: var(--display);
  font-size: 36px;
  font-weight: 400;
  letter-spacing: -0.025em;
  margin: 0;
  color: var(--ink);
  line-height: 1.05;
}
.page-title em {
  font-style: italic;
  color: var(--ink-3);
  font-weight: 400;
}
.page-sub {
  font-size: 13px;
  color: var(--ink-3);
  margin: 8px 0 0;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  margin: 0 0 8px;
}

/* ─── Cards ────────────────────────────────────────── */
.card {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--rule);
}
.card-head h3 {
  margin: 0;
  font-family: var(--ui);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--ink);
}
.card-head .meta {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.card-body { padding: 18px; }
.card-body.flush { padding: 0; }

/* ─── Tables ───────────────────────────────────────── */
table.t {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.t th {
  text-align: left;
  font-weight: 500;
  font-size: 11px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper-2);
}
table.t td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--rule);
  color: var(--ink-2);
  vertical-align: middle;
}
table.t tr:last-child td { border-bottom: none; }
table.t td.num { font-family: var(--mono); text-align: right; color: var(--ink); }
table.t .strong { font-weight: 500; color: var(--ink); }

/* ─── Pills / chips ────────────────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 500;
  background: var(--paper-3);
  color: var(--ink-2);
  border: 1px solid var(--rule);
  white-space: nowrap;
}
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.chip.internal { background: var(--internal-soft); color: var(--internal); border-color: transparent; }
.chip.muted { color: var(--ink-3); background: var(--paper-2); }

/* ─── Internal-only treatment ──────────────────────── */
.internal-zone {
  position: relative;
  background:
    repeating-linear-gradient(
      135deg,
      transparent 0 8px,
      var(--internal-soft) 8px 9px
    );
  border: 1px dashed var(--internal);
  border-radius: 8px;
  padding: 14px;
}
.internal-zone::before {
  content: "INTERNAL — not shown to customer";
  position: absolute;
  top: -8px; left: 12px;
  background: var(--paper);
  padding: 0 6px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  color: var(--internal);
  text-transform: uppercase;
}

/* ─── Inputs ───────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}
.input, .select {
  padding: 8px 10px;
  border: 1px solid var(--rule-2);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink);
  font-size: 13.5px;
  font-family: var(--ui);
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.input.mono { font-family: var(--mono); text-align: right; }
.input:focus, .select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input.empty { background: var(--paper-2); color: var(--ink-4); }
.input.fresh { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.input.fresh::after { content: ""; }

/* "diff" highlight — values that changed since last visit */
.diff-mark {
  position: relative;
}
.diff-mark::after {
  content: "";
  position: absolute;
  top: -3px; right: -6px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--paper);
}

/* ─── Verdict (margin) component ───────────────────── */
.verdict {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 22px 24px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  align-items: center;
}
.verdict.good { border-left: 3px solid var(--good); }
.verdict.warn { border-left: 3px solid var(--warn); }
.verdict.bad { border-left: 3px solid var(--bad); }

.verdict .num {
  font-family: var(--display);
  font-size: 64px;
  font-weight: 400;
  letter-spacing: -0.04em;
  line-height: 0.95;
  color: var(--ink);
}
.verdict .num .pct { font-size: 32px; color: var(--ink-3); margin-left: 4px; font-style: italic; }
.verdict .label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.verdict .status-tag {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.verdict.good .status-tag { color: var(--good); }
.verdict.warn .status-tag { color: var(--warn); }
.verdict.bad .status-tag { color: var(--bad); }

/* range bar showing position vs floor/target */
.range {
  position: relative;
  height: 64px;
  margin-top: 6px;
}
.range .track {
  position: absolute;
  top: 28px; left: 0; right: 0;
  height: 6px;
  background: linear-gradient(to right,
    var(--bad-soft) 0%, var(--bad-soft) 25%,
    var(--warn-soft) 25%, var(--warn-soft) 60%,
    var(--good-soft) 60%, var(--good-soft) 100%);
  border-radius: 3px;
}
.range .marker {
  position: absolute;
  top: 18px;
  width: 2px; height: 26px;
  background: var(--ink);
  transform: translateX(-1px);
}
.range .marker .pin {
  position: absolute;
  top: -22px; left: 50%; transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
}
.range .marker .pin::after {
  content: "";
  position: absolute;
  top: 100%; left: 50%; transform: translateX(-50%);
  border: 4px solid transparent;
  border-top-color: var(--ink);
}
.range .gate {
  position: absolute; top: 14px; height: 34px;
  width: 1px;
  background: var(--ink-3);
  opacity: 0.4;
}
.range .gate-label {
  position: absolute;
  top: 52px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  transform: translateX(-50%);
  white-space: nowrap;
}

/* ─── Slider ───────────────────────────────────────── */
.slider-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 0;
}
.slider-row .slider {
  flex: 1;
  -webkit-appearance: none; appearance: none;
  height: 4px;
  background: var(--paper-3);
  border-radius: 2px;
  outline: none;
}
.slider-row .slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--ink);
  cursor: grab;
  border: 2px solid var(--paper);
  box-shadow: 0 0 0 1px var(--ink);
}
.slider-row .val {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--ink);
  font-weight: 500;
  min-width: 56px;
  text-align: right;
}

/* ─── Activity / where was I ───────────────────────── */
.next-action {
  background: linear-gradient(135deg, var(--accent-soft), var(--paper));
  border: 1px solid var(--accent);
  border-radius: 10px;
  padding: 18px 20px;
  display: flex; align-items: center; gap: 18px;
}
.next-action .glyph-circle {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--paper);
  display: grid; place-items: center;
  font-family: var(--display);
  font-style: italic;
  font-size: 18px;
  flex-shrink: 0;
}
.next-action .body { flex: 1; }
.next-action .body .lead {
  font-family: var(--display);
  font-size: 18px;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0;
  font-weight: 400;
}
.next-action .body .lead em { font-style: italic; color: var(--accent-ink); }
.next-action .body .meta {
  font-size: 12px;
  color: var(--ink-3);
  margin: 2px 0 0;
}

/* ─── Stack waterfall (cost-stack visualisation) ───── */
.stack {
  display: flex;
  align-items: stretch;
  height: 40px;
  border-radius: 6px;
  overflow: hidden;
  font-family: var(--mono);
  font-size: 11px;
  border: 1px solid var(--rule);
}
.stack .seg {
  display: flex; align-items: center; justify-content: center;
  color: var(--paper);
  padding: 0 8px;
  white-space: nowrap;
  border-right: 1px solid var(--paper);
  position: relative;
}
.stack .seg:last-child { border-right: none; }
.stack .seg.pkg { background: oklch(0.55 0.08 250); }
.stack .seg.prod { background: oklch(0.50 0.08 220); }
.stack .seg.frt { background: oklch(0.55 0.08 195); }
.stack .seg.markup { background: var(--ink); }
.stack .seg.adj { background: var(--ink-2); }

/* ─── SKU list for the cost workspace ──────────────── */
.sku-list {
  display: flex; flex-direction: column;
}
.sku-row {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: background 120ms;
}
.sku-row:last-child { border-bottom: none; }
.sku-row:hover { background: var(--paper-2); }
.sku-row.active { background: var(--paper-3); }
.sku-row.active .sku-name { color: var(--ink); font-weight: 500; }
.sku-row .num-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-4);
  text-align: center;
}
.sku-row .sku-name {
  font-size: 13.5px;
  color: var(--ink-2);
  display: flex; flex-direction: column; gap: 1px;
}
.sku-row .sku-name .sub {
  font-size: 11px;
  color: var(--ink-4);
  font-family: var(--mono);
  letter-spacing: 0.02em;
}
.sku-row .completion {
  display: flex; gap: 2px;
}
.sku-row .completion .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--paper-3);
  border: 1px solid var(--rule-2);
}
.sku-row .completion .dot.filled { background: var(--ink); border-color: var(--ink); }
.sku-row .completion .dot.partial { background: var(--accent); border-color: var(--accent); }

/* ─── Tier rail ─────────────────────────────────────── */
.tier-rail {
  display: flex; flex-direction: column;
  gap: 6px;
  padding: 8px;
}
.tier-pill {
  display: flex; flex-direction: column;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--paper-2);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 120ms;
  position: relative;
}
.tier-pill:hover { background: var(--paper-3); }
.tier-pill.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tier-pill.active .tier-label,
.tier-pill.active .tier-qty,
.tier-pill.active .tier-margin { color: var(--paper); }
.tier-pill .tier-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.tier-pill .tier-qty {
  font-family: var(--display);
  font-size: 18px;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin-top: 2px;
}
.tier-pill .tier-margin {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 4px;
}

/* ─── Cost-stack workspace ─────────────────────────── */
.workspace {
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  gap: 16px;
  align-items: start;
}

.lens {
  display: flex; gap: 4px;
  padding: 4px;
  background: var(--paper-2);
  border-radius: 8px;
  border: 1px solid var(--rule);
}
.lens button {
  padding: 6px 12px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: var(--ink-3);
  font-size: 12.5px;
  font-family: var(--ui);
  font-weight: 500;
  cursor: pointer;
  letter-spacing: -0.005em;
}
.lens button:hover { color: var(--ink); }
.lens button.active {
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.lens button .count {
  font-family: var(--mono);
  font-size: 10px;
  margin-left: 4px;
  opacity: 0.5;
}

/* line items inside lens */
.line {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--rule);
}
.line:last-child { border-bottom: none; }
.line .lab {
  display: flex; align-items: center; gap: 10px;
}
.line .lab .marker {
  width: 8px; height: 8px;
  border-radius: 2px;
  background: var(--ink-4);
}
.line .lab .marker.pkg { background: oklch(0.55 0.08 250); }
.line .lab .marker.prod { background: oklch(0.50 0.08 220); }
.line .lab .marker.frt { background: oklch(0.55 0.08 195); }
.line .lab .name {
  font-size: 13.5px;
  color: var(--ink);
}
.line .lab .name .sub {
  display: block;
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 1px;
}
.line .markup {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-3);
  background: var(--paper-2);
  padding: 3px 7px;
  border-radius: 4px;
}
.line .price {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--ink);
  text-align: right;
  min-width: 80px;
}
.line .price .empty { color: var(--ink-4); font-style: italic; }
.line.empty .price { background: var(--paper-2); border-radius: 4px; padding: 2px 6px; }

/* totals panel */
.totals {
  background: var(--paper-3);
  padding: 14px 18px;
  border-top: 1px solid var(--rule);
  display: flex; flex-direction: column;
  gap: 6px;
}
.totals .row {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 13px;
  color: var(--ink-2);
}
.totals .row .v {
  font-family: var(--mono);
  font-weight: 500;
  color: var(--ink);
}
.totals .row.sub { font-size: 12px; color: var(--ink-3); }
.totals .row.sub .v { font-weight: 400; color: var(--ink-2); }
.totals .row.grand { padding-top: 8px; margin-top: 4px; border-top: 1px solid var(--rule); }
.totals .row.grand .lab {
  font-family: var(--display);
  font-size: 16px;
  color: var(--ink);
}
.totals .row.grand .v {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: -0.02em;
  font-weight: 400;
}

/* ─── Quote setup ───────────────────────────────────── */
.setup-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
  align-items: start;
}
.tier-builder {
  display: flex; flex-direction: column; gap: 6px;
}
.tier-row {
  display: grid;
  grid-template-columns: 36px 1fr 110px 36px;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: 6px;
}
.tier-row .idx {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  text-align: center;
}
.tier-row input { background: var(--paper); }
.tier-row .x {
  background: transparent; border: none; color: var(--ink-4);
  font-family: var(--mono); font-size: 14px; cursor: pointer;
}

.sku-table-row {
  display: grid;
  grid-template-columns: 36px 2fr 1fr 90px 90px 36px;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: 6px;
}
.sku-table-row .idx {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  text-align: center;
}

/* ─── Project view — recent quotes / activity ─────── */
.kv {
  display: grid; grid-template-columns: 120px 1fr;
  gap: 4px 20px;
  padding: 4px 0;
  font-size: 13px;
}
.kv dt {
  font-family: var(--mono);

  position: sticky; top: 0; z-index: 5;
}
.r6-state-strip .lbl { color: var(--ink-4); margin-right: 8px; text-transform: uppercase; letter-spacing: 0.10em; }
.r6-state-strip button {
  padding: 6px 12px; border-radius: 5px; color: var(--ink-3);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
  text-transform: uppercase;
}
.r6-state-strip button:hover { color: var(--ink); }
.r6-state-strip button.active { background: var(--paper-3); color: var(--ink); }
.r6-state-strip .right { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; }
.r6-state-strip .right a { color: var(--ink-3); }

.r6-page { padding: 28px 40px 80px; max-width: 1480px; }

.r6-page-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 22px; gap: 24px;
}
.r6-page-head h1 {
  font-family: var(--display); font-weight: 500; font-size: 30px;
  margin: 0 0 4px; letter-spacing: -0.012em;
  font-style: italic;
}
.r6-page-head h1 em { font-style: normal; color: var(--ink-3); font-weight: 400; }
.r6-page-head .sub { color: var(--ink-3); font-size: 13px; margin: 0; max-width: 64ch; }
.r6-page-head .meta {
  margin-top: 8px;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-4);
  letter-spacing: 0.04em; display: flex; gap: 14px; align-items: center;
}
.r6-page-head .meta .live {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--good); box-shadow: 0 0 0 3px var(--good-soft);
}

/* SKU + scenario context strip */
.r6-context {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 10px;
  margin-bottom: 18px;
}
.r6-context .anchor-pill {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 10px;
  background: var(--paper-3);
  border-radius: 6px;
  font-family: var(--mono); font-size: 11px; color: var(--ink);
  letter-spacing: 0.02em;
}
.r6-context .anchor-pill .star {
  font-family: var(--display); color: var(--accent-ink); font-style: italic; font-size: 13px;
}
.r6-context .anchor-pill .code { color: var(--ink-3); }
.r6-context .ctx-name {
  font-family: var(--display); font-style: italic; font-size: 17px; font-weight: 500;
  color: var(--ink); letter-spacing: -0.005em;
}
.r6-context .ctx-meta {
  font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em;
}
.r6-context .ctx-spacer { flex: 1; }
.r6-context .ctx-action {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em;
  color: var(--ink-3); padding: 4px 8px;
}
.r6-context .ctx-action:hover { color: var(--ink); }

/* ─── Cost Stack header — multi-tier horizontal ─── */
.r6-stack {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 12px;
  margin-bottom: 24px;
  overflow: hidden;
}

.r6-stack-head {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 16px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
}
.r6-stack-head h2 {
  font-family: var(--display); font-weight: 500; font-size: 17px;
  margin: 0; letter-spacing: -0.005em;
}
.r6-stack-head .legend {
  display: flex; gap: 14px; align-items: center;
  font-family: var(--mono); font-size: 10px; color: var(--ink-4); letter-spacing: 0.06em;
  text-transform: uppercase;
}
.r6-stack-head .legend .swatch {
  display: inline-block; width: 9px; height: 9px; border-radius: 2px;
  margin-right: 5px; vertical-align: middle;
}
.r6-stack-head .legend .pkg  { background: var(--comp-pkg); }
.r6-stack-head .legend .prod { background: var(--comp-prod); }
.r6-stack-head .legend .frt  { background: var(--comp-frt); }
.r6-stack-head .legend .dt   {
  background: repeating-linear-gradient(135deg, var(--comp-dt) 0 3px, var(--comp-dt-stripe) 3px 6px);
  border: none;
}
.r6-stack-head .legend .pass { background: var(--ink-4); }

.r6-stack-grid {
  display: grid; gap: 1px;
  background: var(--rule);
  /* columns set inline by JS based on tier count */
}

.r6-tier-col {
  background: var(--paper);
  display: flex; flex-direction: column;
  position: relative;
  cursor: pointer;
  transition: background 80ms;
}
.r6-tier-col:hover { background: var(--paper-2); }
.r6-tier-col.active {
  background: var(--paper);
  box-shadow: inset 0 -3px 0 var(--ink);
}

.r6-tier-col-head {
  padding: 14px 18px 6px;
  display: flex; flex-direction: column; gap: 4px;
}
.r6-tier-col-head .label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.10em;
  text-transform: uppercase; color: var(--ink-4);
}
.r6-tier-col-head .qty {
  font-family: var(--display); font-size: 22px; letter-spacing: -0.015em;
  color: var(--ink); font-weight: 500; line-height: 1;
}
.r6-tier-col-head .qty .units {
  font-family: var(--mono); font-size: 10px; color: var(--ink-4);
  margin-left: 6px; letter-spacing: 0.04em; vertical-align: super;
}

.r6-tier-col-bars {
  padding: 12px 18px 6px;
  display: flex; flex-direction: column; gap: 2px;
  flex: 1;
}
/* Layered cost bars — each component is a row,
   the bar itself is split into "cost" + "markup" segments */
.r6-comp-row {
  display: grid; grid-template-columns: 38px 1fr 64px;
  gap: 8px; align-items: center;
  font-family: var(--mono); font-size: 10.5px;
}
.r6-comp-row .key {
  color: var(--ink-4); letter-spacing: 0.06em;
  text-transform: uppercase; font-weight: 500;
}
.r6-comp-row.dt .key { color: var(--internal); }
.r6-comp-row.empty .key { color: var(--ink-4); opacity: 0.6; }

.r6-bar {
  display: flex; height: 18px; border-radius: 3px;
  overflow: hidden;
  background: var(--paper-3);
}
.r6-bar .seg {
  display: block; height: 100%;
}
/* ─── Cost-stack component color tokens ───
   Defined as variables so light/dark can shift luminance independently.
   Hues spaced for maximum perceptual separation:
     PKG 250 (blue) → FRT 215 (cyan) → PROD 175 (green-teal) → RAW 145 (green)
   Each hop is 25–40° in OKLCH, well above the just-noticeable-difference. */
:root {
  --comp-pkg:  oklch(0.55 0.10 250);
  --comp-prod: oklch(0.52 0.10 175);
  --comp-frt:  oklch(0.58 0.09 215);
  --comp-raw:  oklch(0.55 0.10 145);
  --comp-dt:   oklch(0.52 0.13 290);   /* purple, bumped chroma vs default --internal */
  --comp-dt-stripe: oklch(0.52 0.13 290 / 0.42);
}
[data-theme="dark"] {
  --comp-pkg:  oklch(0.74 0.13 250);
  --comp-prod: oklch(0.74 0.13 175);
  --comp-frt:  oklch(0.78 0.12 215);
  --comp-raw:  oklch(0.76 0.14 145);
  --comp-dt:   oklch(0.72 0.16 290);
  --comp-dt-stripe: oklch(0.72 0.16 290 / 0.55);
}

.r6-bar .seg.cost.pkg   { background: var(--comp-pkg); }
.r6-bar .seg.cost.prod  { background: var(--comp-prod); }
.r6-bar .seg.cost.frt   { background: var(--comp-frt); }
.r6-bar .seg.cost.dt    {
  background: repeating-linear-gradient(
    135deg,
    var(--comp-dt) 0 4px,
    var(--comp-dt-stripe) 4px 8px
  );
}
[data-theme="dark"] .r6-bar .seg.cost.dt {
  /* Outline keeps the hatched purple from dissolving against the dark surface */
  outline: 1px solid oklch(0.85 0.05 290 / 0.40);
  outline-offset: -1px;
}
.r6-bar .seg.cost.pass  { background: var(--ink-4); }
.r6-bar .seg.markup     {
  background: var(--ink);
  border-left: 1px solid var(--paper);
}
.r6-bar.empty {
  background: var(--paper-2);
  border: 1px dashed var(--rule-2);
  border-radius: 3px;
}

.r6-comp-row .price {
  text-align: right;
  color: var(--ink-2); font-size: 11px; letter-spacing: -0.005em;
}
.r6-comp-row.empty .price { color: var(--ink-4); font-style: italic; }

/* Tier subtotal cluster */
.r6-tier-col-foot {
  margin-top: auto;
  padding: 14px 18px 16px;
  border-top: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 6px;
}
.r6-tier-col-foot .row {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; color: var(--ink-3);
}
.r6-tier-col-foot .row .v { font-family: var(--mono); color: var(--ink-2); font-size: 12px; }
.r6-tier-col-foot .row.sub { font-size: 11px; color: var(--ink-4); }
.r6-tier-col-foot .row.sub .v { color: var(--ink-3); font-size: 11px; }
.r6-tier-col-foot .row.sell {
  margin-top: 4px;
  padding-top: 6px;
  border-top: 1px solid var(--rule);
}
.r6-tier-col-foot .row.sell .lab { font-family: var(--display); font-size: 14px; color: var(--ink); }
.r6-tier-col-foot .row.sell .v { font-family: var(--display); font-size: 22px; color: var(--ink); letter-spacing: -0.02em; font-weight: 500; }
.r6-tier-col-foot .row.sell .v.empty { font-family: var(--display); color: var(--ink-4); font-style: italic; font-weight: 400; }

.r6-tier-col-foot .margin {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
}
.r6-tier-col-foot .margin .pip { width: 6px; height: 6px; border-radius: 50%; }
.r6-tier-col-foot .margin.good { color: var(--good); }
.r6-tier-col-foot .margin.good .pip { background: var(--good); }
.r6-tier-col-foot .margin.warn { color: var(--warn); }
.r6-tier-col-foot .margin.warn .pip { background: var(--warn); }
.r6-tier-col-foot .margin.bad { color: var(--bad); }
.r6-tier-col-foot .margin.bad .pip { background: var(--bad); }
.r6-tier-col-foot .margin.below_target { color: var(--warn); }
.r6-tier-col-foot .margin.below_target .pip { background: var(--warn); }
.r6-tier-col-foot .margin.incomplete { color: var(--ink-4); font-style: italic; }
.r6-tier-col-foot .margin.incomplete .pip { background: var(--rule-2); border: 1px dashed var(--ink-4); }

.r6-tier-col .add-tier {
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em;
  color: var(--ink-3); background: var(--paper-2);
  border: 1px dashed var(--rule-2);
  margin: 14px;
  border-radius: 8px;
  text-transform: uppercase;
  cursor: pointer;
}
.r6-tier-col .add-tier:hover { color: var(--ink); border-color: var(--ink-4); }

/* ─── Section summary rows ─── */
.r6-sections {
  display: flex; flex-direction: column;
  gap: 14px;
}

.r6-section {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 12px;
  overflow: hidden;
}

.r6-section-row {
  display: grid;
  grid-template-columns: 32px 1fr auto auto auto auto;
  gap: 16px; align-items: center;
  padding: 16px 22px;
  cursor: pointer;
  transition: background 80ms;
}
.r6-section-row:hover { background: var(--paper-2); }
.r6-section.open .r6-section-row {
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);
}

.r6-section-row .chev {
  font-family: var(--mono); color: var(--ink-3); font-size: 12px;
  transition: transform 120ms;
  display: grid; place-items: center;
}
.r6-section.open .r6-section-row .chev { transform: rotate(90deg); }

.r6-section-row .head {
  display: flex; flex-direction: column; gap: 3px;
}
.r6-section-row .head .name {
  font-family: var(--display); font-weight: 500; font-size: 18px;
  letter-spacing: -0.005em; color: var(--ink);
}
.r6-section-row .head .meta {
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  letter-spacing: 0.04em;
}

.r6-section-row .status-chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
  padding: 3px 8px; border-radius: 999px;
  background: var(--paper-3); color: var(--ink-3);
  border: 1px solid var(--rule);
  text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 5px;
}
.r6-section-row .status-chip.empty { color: var(--ink-4); }
.r6-section-row .status-chip.in_progress { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.r6-section-row .status-chip.complete { background: var(--good-soft); color: var(--good); border-color: transparent; }

.r6-section-row .owner {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: 0.04em;
  display: flex; align-items: center; gap: 6px;
}
.r6-section-row .owner .av {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--paper-3); border: 1px solid var(--rule);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-2); font-weight: 600;
}

/* Mini-stack — same horizontal grammar as the cost stack header */
.r6-section-row .mini-stack {
  display: flex; gap: 12px; align-items: center;
  font-family: var(--mono); font-size: 10.5px;
}
.r6-section-row .mini-stack .tier-mini {
  display: flex; flex-direction: column; gap: 2px;
  align-items: flex-end;
}
.r6-section-row .mini-stack .tier-mini.active .val { color: var(--ink); font-weight: 500; }
.r6-section-row .mini-stack .tier-mini .lbl {
  font-size: 9px; letter-spacing: 0.08em; color: var(--ink-4);
  text-transform: uppercase;
}
.r6-section-row .mini-stack .tier-mini .val {
  font-size: 12px; color: var(--ink-3);
}
.r6-section-row .mini-stack .tier-mini .val.empty { color: var(--ink-4); font-style: italic; font-size: 10.5px; }

.r6-section-row .open-cta {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em;
  color: var(--ink-3); text-transform: uppercase;
}
.r6-section.open .r6-section-row .open-cta { color: var(--accent-ink); }

/* ─── Drawer ─── */
.r6-drawer {
  padding: 18px 22px 22px;
  background: var(--paper-2);
}

.r6-drawer .drawer-toolbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px;
  margin-bottom: 14px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 8px;
}
.r6-drawer .drawer-toolbar .lhs {
  display: flex; gap: 14px; align-items: baseline;
  font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em;
}
.r6-drawer .drawer-toolbar .lhs strong { color: var(--ink); font-weight: 500; }
.r6-drawer .drawer-toolbar .rhs {
  display: flex; gap: 6px;
}

/* Drawer table */
.r6-dt {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 8px;
  overflow: hidden;
}
.r6-dt-head {
  display: grid; gap: 12px;
  padding: 10px 18px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.10em;
  text-transform: uppercase; color: var(--ink-4); font-weight: 500;
}
.r6-dt-head .num { text-align: right; }
.r6-dt-row {
  display: grid; gap: 12px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--rule);
  align-items: center;
  font-size: 13px; color: var(--ink-2);
}
.r6-dt-row:last-child { border-bottom: none; }
.r6-dt-row:hover { background: var(--paper-2); }

.r6-dt-row .name {
  display: flex; flex-direction: column; gap: 2px;
}
.r6-dt-row .name .lab { color: var(--ink); font-weight: 500; font-size: 13.5px; }
.r6-dt-row .name .sub { color: var(--ink-4); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; }

.r6-dt-row .cat {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: 0.04em;
}
.r6-dt-row .cat .src {
  color: var(--ink-4); font-size: 9.5px; display: block; margin-top: 2px;
}
.r6-dt-row .sup { font-size: 12.5px; color: var(--ink-2); }
.r6-dt-row .markup {
  font-family: var(--mono); font-size: 12px; color: var(--ink-2);
  background: var(--paper-3);
  display: inline-block; padding: 2px 7px; border-radius: 4px;
  text-align: center;
}

.r6-dt-row .cell-num {
  font-family: var(--mono); font-size: 12.5px; color: var(--ink);
  text-align: right; letter-spacing: -0.005em;
}
.r6-dt-row .cell-num.empty {
  color: var(--ink-4); background: var(--paper-2); border: 1px dashed var(--rule-2);
  border-radius: 4px; padding: 3px 6px; font-style: italic; font-size: 11px;
}
.r6-dt-row .cell-num .raw { display: block; font-size: 10px; color: var(--ink-4); margin-top: 1px; }

.r6-dt-row .actions {
  display: flex; gap: 4px; justify-content: flex-end;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
}

.r6-dt-foot {
  display: grid; gap: 12px;
  padding: 11px 18px;
  background: var(--paper-3);
  border-top: 1px solid var(--rule);
  font-family: var(--mono); font-size: 11.5px; color: var(--ink);
  align-items: center;
}
.r6-dt-foot .total-lab { color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; font-size: 10px; }
.r6-dt-foot .num { text-align: right; font-weight: 500; letter-spacing: -0.01em; font-size: 13px; }
.r6-dt-foot .num.empty { color: var(--ink-4); font-style: italic; font-weight: 400; }

/* Packaging-specific column widths */
.r6-dt.pkg .r6-dt-head, .r6-dt.pkg .r6-dt-row {
  grid-template-columns: 2fr 1.2fr 1fr 70px repeat(var(--cols, 4), 80px) 60px;
}
.r6-dt.pkg .r6-dt-foot {
  grid-template-columns: 2fr 1.2fr 1fr 70px repeat(var(--cols, 4), 80px) 60px;
}

/* Production-specific column widths (adds Kind) */
.r6-dt.prod .r6-dt-head, .r6-dt.prod .r6-dt-row {
  grid-template-columns: 2fr 1.1fr 1fr 90px 70px repeat(var(--cols, 4), 80px) 60px;
}
.r6-dt.prod .r6-dt-foot {
  grid-template-columns: 2fr 1.1fr 1fr 90px 70px repeat(var(--cols, 4), 80px) 60px;
}

/* Production toggles */
.r6-prod-toggles {
  display: flex; gap: 0;
  margin-bottom: 14px;
  border: 1px solid var(--rule); border-radius: 10px;
  overflow: hidden;
  background: var(--paper);
}
.r6-prod-toggle {
  flex: 1;
  display: grid; grid-template-columns: 22px 1fr; gap: 10px;
  padding: 12px 14px;
  border-right: 1px solid var(--rule);
  cursor: pointer;
  align-items: flex-start;
}
.r6-prod-toggle:last-child { border-right: none; }
.r6-prod-toggle:hover { background: var(--paper-2); }
.r6-prod-toggle.on {
  background: oklch(from var(--accent) l c h / 0.05);
  box-shadow: inset 3px 0 0 var(--accent);
}
.r6-prod-toggle .tog {
  width: 22px; height: 14px; border-radius: 999px;
  background: var(--paper-3); border: 1px solid var(--rule-2);
  position: relative; transition: background 80ms;
  margin-top: 2px;
}
.r6-prod-toggle .tog::after {
  content: ""; position: absolute; top: 1px; left: 1px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--paper); transition: transform 100ms;
  box-shadow: 0 1px 2px oklch(0 0 0 / 0.25);
}
.r6-prod-toggle.on .tog { background: var(--accent); border-color: var(--accent); }
.r6-prod-toggle.on .tog::after { transform: translateX(8px); }

.r6-prod-toggle .body { display: flex; flex-direction: column; gap: 2px; }
.r6-prod-toggle .body .lab {
  font-size: 12.5px; color: var(--ink); font-weight: 500;
}
.r6-prod-toggle .body .desc {
  font-size: 11.5px; color: var(--ink-3); line-height: 1.45;
}
.r6-prod-toggle .body .consequence {
  margin-top: 4px;
  font-family: var(--mono); font-size: 10px; color: var(--ink-4);
  letter-spacing: 0.04em;
}
.r6-prod-toggle.on .body .consequence { color: var(--accent-ink); }

/* Production sub-section: bulk raw cost */
.r6-prod-sub {
  margin-top: 14px;
  padding: 14px 18px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 8px;
  display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center;
}
.r6-prod-sub .lhs { display: flex; flex-direction: column; gap: 3px; }
.r6-prod-sub .lhs .lab { font-size: 13px; color: var(--ink); font-weight: 500; }

.r6-badge.accent { background: oklch(from var(--accent) l c h / 0.10); color: var(--accent-ink); border-color: oklch(from var(--accent) l c h / 0.30); }

/* paper-4 is used by the rail */
:root { --paper-4: oklch(0.92 0.012 85); }
[data-theme="dark"] { --paper-4: oklch(0.28 0.014 255); }

/* ─── R6.1 — RAW row in cost stack (indented under PROD) ─── */
.r6-comp-row.raw {
  /* RAW gets an indent + a parenting tick to signal "child of PROD" */
  grid-template-columns: 38px 1fr 64px;
  position: relative;
}

  padding-left: 14px;
  position: relative;
}
.r6-comp-row.raw .key::before {
  content: "";
  position: absolute;

  width: 7px; height: 7px;
  border-left: 1px solid var(--rule-2);
  border-bottom: 1px solid var(--rule-2);
  transform: translateY(-90%);
  border-bottom-left-radius: 2px;
}
/* RAW row — indented under PROD, uses RAW component token */
.r6-bar .seg.cost.raw {
  background: var(--comp-raw);
}

/* Legend pip for RAW */
.r6-stack-head .legend .raw { background: var(--comp-raw); }

/* Raws-mode banner inside Bulk Raw drawer / cost stack note */
.r6-raws-mode {

}

  width: 10px; height: 10px; border-radius: 50%;

}
.r6-raws-opt.on .lab .pip { background: oklch(0.55 0.07 145); border-color: oklch(0.55 0.07 145); box-shadow: inset 0 0 0 2px var(--paper); }
.r6-raws-opt .desc { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.r6-raws-opt .consequence {

  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.05em;

}

.r6-raw-cat {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 10px;

.r6-raw-cat-head {

}
.r6-raw-cat-head .meta {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);

.r6-raw-cat-head .markup {

.r6-raw-cat-head .total {

.r6-raw-ing .actions {

}

.r6-raw-ing-head {
  display: grid;
  grid-template-columns: 2fr 80px 110px 110px 1fr 60px;
  gap: 12px;
  padding: 8px 16px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);

}

/* Section-row deposit chip */
.r6-deposit-chip {
  display: inline-flex; align-items: center; gap: 5px;

}

}

/* Dual yield reconcile */

  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;

}
.r6-yield-block {

const { useState: useStateRoot, useEffect: useEffectRoot } = React;

function R6App() {
  const [tweaks, setTweaks] = useStateRoot(window.TWEAK_DEFAULTS || {
    theme: "light", state: "inProgress", openSection: "production",
  });
  const [showPanel, setShowPanel] = useStateRoot(false);

  useEffectRoot(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme || "light");
  }, [tweaks.theme]);

  const setTweak = (k, v) => setTweaks(prev => {
    const next = typeof k === "object" ? { ...prev, ...k } : { ...prev, [k]: v };

    return next;
  });

    const handler = (e) => {
      if (e.data?.type === "__activate_edit_mode") setShowPanel(true);
      else if (e.data?.type === "__deactivate_edit_mode") setShowPanel(false);
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  // Production toggles — unified into one tweak object so persistence is simple
  const prodToggles = {
    customer_ships_raws: tweaks.customer_ships_raws,
    allocate_service_fees_to_unit_cost: tweaks.allocate_service_fees_to_unit_cost,
  };
  const onProdToggle = (key) => {
    const data = window.NXR6.production[tweaks.state];
    const current = tweaks[key] != null ? tweaks[key] : data[key];
    setTweak(key, !current);
  };

  // Freight treatments — keyed by line id
  const freightTreatments = {
    fr_1: tweaks.treat_fr_1,
    fr_2: tweaks.treat_fr_2,
    fr_s1: tweaks.treat_fr_s1,
  };
  const onFreightTreatment = (id, treatment) => {
    setTweak(`treat_${id}`, treatment);
  };

  // Sample project context for the rail
  const projectForRail = window.NXR4 ? window.NXR4.project_detail : null;

  return (
    <div data-screen-label={`Round 6 · ${tweaks.state}`}>
      <div className="r4-shell">
        <window.NXRail
          project={projectForRail}
          activeScenario={null}
          currentSurface={null}
          onSwitchScenario={() => {}}
          onGoToOrganizer={() => { window.location.href = "Nexus Round 4.html"; }}
        />

        <main style={{ overflow: "hidden" }}>
          {/* Top state strip */}
          <div className="r6-state-strip">
            <span className="lbl">State</span>
            <button className={tweaks.state === "empty" ? "active" : ""} onClick={() => setTweak("state", "empty")}>① Empty / fresh</button>
            <button className={tweaks.state === "inProgress" ? "active" : ""} onClick={() => setTweak("state", "inProgress")}>② Multi-tier · in progress</button>
            <button className={tweaks.state === "singleComplete" ? "active" : ""} onClick={() => setTweak("state", "singleComplete")}>③ Single-tier · complete</button>
            <span className="right">
              <a href="Nexus Round 5.html">← Round 5</a>
              <span style={{ margin: "0 8px" }}>·</span>
              <a href="docs/r6-data-source-map.md">Data-source map</a>
              <span style={{ margin: "0 8px" }}>·</span>
              <a href="docs/r6-designer-notes.md">Designer notes</a>
            </span>
          </div>

          {/* Section drill-down strip */}
          <div className="r6-state-strip" style={{ background: "var(--paper-2)" }}>
            <span className="lbl">Drill</span>
            <button className={tweaks.openSection === null ? "active" : ""} onClick={() => setTweak("openSection", null)}>All collapsed</button>
            <button className={tweaks.openSection === "packaging" ? "active" : ""} onClick={() => setTweak("openSection", "packaging")}>Packaging</button>
            <button className={tweaks.openSection === "production" ? "active" : ""} onClick={() => setTweak("openSection", "production")}>Production</button>
            <button className={tweaks.openSection === "bulk_raw" ? "active" : ""} onClick={() => setTweak("openSection", "bulk_raw")}>Bulk Raw</button>
            <button className={tweaks.openSection === "freight" ? "active" : ""} onClick={() => setTweak("openSection", "freight")}>Freight</button>
          </div>

          <window.NXR6Page
            state={tweaks.state}
            openSection={tweaks.openSection}
            onOpenSection={(v) => setTweak("openSection", v)}
            prodToggles={prodToggles}
            onProdToggle={onProdToggle}
            freightTreatments={freightTreatments}
            onFreightTreatment={onFreightTreatment}
            rawsMode={tweaks.raws_mode}
            onRawsMode={(v) => setTweak("raws_mode", v)}
          />
        </main>
      </div>

      {showPanel && window.TweaksPanel && (
        <window.TweaksPanel onClose={() => { setShowPanel(false); window.parent.postMessage({ type: "__edit_mode_dismissed" }, "*"); }}>
          <window.TweakSection title="Display">
            <window.TweakRadio label="Theme" value={tweaks.theme} onChange={(v) => setTweak("theme", v)} options={[
              { value: "light", label: "Light" }, { value: "dark", label: "Dark" },
            ]} />
          </window.TweakSection>
          <window.TweakSection title="Page state">
            <window.TweakRadio label="State" value={tweaks.state} onChange={(v) => setTweak("state", v)} options={[
              { value: "empty",          label: "① Empty" },
              { value: "inProgress",     label: "② In progress" },
              { value: "singleComplete", label: "③ Single complete" },
            ]} />
            <window.TweakSelect label="Drill-down" value={tweaks.openSection || ""} onChange={(v) => setTweak("openSection", v || null)} options={[
              { value: "",           label: "All collapsed" },
              { value: "packaging",  label: "Packaging" },
              { value: "production", label: "Production" },
              { value: "bulk_raw",   label: "Bulk Raw" },
              { value: "freight",    label: "Freight" },
            ]} />
          </window.TweakSection>
          <window.TweakSection title="Bulk Raw mode">
            <window.TweakSelect label="Raws sourcing" value={tweaks.raws_mode || (window.NXR6_1?.raws_mode_default[tweaks.state] || "dps_sources")} onChange={(v) => setTweak("raws_mode", v)} options={[
              { value: "dps_sources",       label: "DPS sources raws" },
              { value: "cm_sources",        label: "CM sources raws" },
              { value: "customer_supplies", label: "Customer supplies" },
            ]} />
          </window.TweakSection>
          {tweaks.openSection === "production" && (
            <window.TweakSection title="Production toggles">
              <window.TweakToggle label="Customer ships raws" value={!!prodToggles.customer_ships_raws} onChange={() => onProdToggle("customer_ships_raws")} />
              <window.TweakToggle label="Allocate fees → unit cost" value={prodToggles.allocate_service_fees_to_unit_cost ?? true} onChange={() => onProdToggle("allocate_service_fees_to_unit_cost")} />
            </window.TweakSection>
          )}
          {tweaks.openSection === "freight" && tweaks.state !== "empty" && (
            <window.TweakSection title="Freight treatment">
              <window.TweakSelect label="Bulk container" value={freightTreatments.fr_1 || (window.NXR6.freight[tweaks.state].lines.find((l) => l.id === "fr_1")?.treatment || "bundled")} onChange={(v) => onFreightTreatment("fr_1", v)} options={[
                { value: "bundled",      label: "Bundled" },
                { value: "pass_through", label: "Passthrough" },
              ]} />
              {tweaks.state === "inProgress" && (
                <window.TweakSelect label="Sample shipment" value={freightTreatments.fr_2 || "pass_through"} onChange={(v) => onFreightTreatment("fr_2", v)} options={[
                  { value: "bundled",      label: "Bundled" },
                  { value: "pass_through", label: "Passthrough" },
                ]} />
              )}
            </window.TweakSection>
          )}
        </window.TweaksPanel>
      )}
    </div>
  );
}

window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;
ReactDOM.createRoot(document.getElementById("root")).render(<R6App />);
</script>

<script type="application/json" id="speaker-notes">[]</script>



</body></html>
