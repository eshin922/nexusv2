<style>/* Nexus Round 2 — sharper, scoped to two surfaces.
   Dark by default. Tokens reused from v1, refined.
   ───────────────────────────────────────────────── */

:root, [data-theme="dark"] {
  --paper:    oklch(0.16 0.012 255);
  --paper-2:  oklch(0.19 0.013 255);
  --paper-3:  oklch(0.225 0.014 255);
  --paper-4:  oklch(0.265 0.015 255);
  --rule:     oklch(0.30 0.014 255);
  --rule-2:   oklch(0.36 0.016 255);

  --ink:      oklch(0.96 0.008 85);
  --ink-2:    oklch(0.84 0.010 85);
  --ink-3:    oklch(0.66 0.012 85);
  --ink-4:    oklch(0.50 0.014 85);

  --accent:       oklch(0.78 0.13 250);
  --accent-soft:  oklch(0.30 0.06 250);
  --accent-ink:   oklch(0.92 0.10 250);

  --good:      oklch(0.78 0.13 155);
  --good-soft: oklch(0.28 0.05 155);
  --warn:      oklch(0.82 0.13 75);
  --warn-soft: oklch(0.30 0.05 70);
  --bad:       oklch(0.74 0.16 25);
  --bad-soft:  oklch(0.32 0.06 25);

  /* INTERNAL — load-bearing visual treatment */
  --internal:       oklch(0.74 0.10 305);
  --internal-soft:  oklch(0.28 0.045 305);
  --internal-rule:  oklch(0.45 0.07 305);

  /* WISHFUL — for any UI that depends on uncommitted backlog */
  --wishful: oklch(0.62 0.04 85);

  --display: "Newsreader", Georgia, serif;
  --ui:      "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono:    "JetBrains Mono", ui-monospace, monospace;

  --shadow-sm: 0 1px 0 oklch(0.30 0.014 255), 0 1px 2px oklch(0 0 0 / 0.4);
  --shadow-md: 0 1px 0 oklch(0.30 0.014 255), 0 8px 24px oklch(0 0 0 / 0.5);
  --shadow-lg: 0 24px 60px oklch(0 0 0 / 0.6);
}

[data-theme="light"] {
  --paper:    oklch(0.985 0.006 85);
  --paper-2:  oklch(0.965 0.008 85);
  --paper-3:  oklch(0.945 0.010 85);
  --paper-4:  oklch(0.925 0.012 85);
  --rule:     oklch(0.88 0.012 85);
  --rule-2:   oklch(0.82 0.014 85);

  --ink:    oklch(0.20 0.02 255);
  --ink-2:  oklch(0.36 0.02 255);
  --ink-3:  oklch(0.52 0.015 255);
  --ink-4:  oklch(0.68 0.012 255);

  --accent:      oklch(0.42 0.14 255);
  --accent-soft: oklch(0.93 0.04 255);
  --accent-ink:  oklch(0.30 0.12 255);

  --good:      oklch(0.55 0.10 155);
  --good-soft: oklch(0.94 0.035 155);
  --warn:      oklch(0.62 0.13 70);
  --warn-soft: oklch(0.95 0.045 70);
  --bad:       oklch(0.55 0.18 25);
  --bad-soft:  oklch(0.95 0.04 25);

  --internal:      oklch(0.50 0.08 305);
  --internal-soft: oklch(0.94 0.025 305);
  --internal-rule: oklch(0.70 0.05 305);

  --wishful: oklch(0.60 0.03 85);
}

/* ─── Reset + base ─────────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); text-decoration: none; }

/* Type primitives */
.eyebrow {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0;
}
.mono { font-family: var(--mono); }
.muted { color: var(--ink-3); }
.dim   { color: var(--ink-4); }

/* ─── Shell ────────────────────────────────────── */
.shell {
  display: grid;
  grid-template-columns: 232px 1fr;
  min-height: 100vh;
}
.sidebar {
  background: var(--paper-2);
  border-right: 1px solid var(--rule);
  padding: 20px 14px;
  display: flex; flex-direction: column; gap: 22px;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: baseline; gap: 8px; padding: 4px 6px; }
.brand .mark { width: 22px; height: 22px; color: var(--ink); align-self: center; display: block; }
.brand .name { font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.brand .ver { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-4); margin-left: 2px; }

.side-section { display: flex; flex-direction: column; gap: 2px; }
.side-section h6 {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-4);
  margin: 0 6px 6px;
  font-weight: 500;
}
.side-link {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-radius: 7px;
  font-size: 13px;
  color: var(--ink-2);
  width: 100%;
  text-align: left;
}
.side-link .glyph { color: var(--ink-4); width: 14px; text-align: center; font-size: 12px; }
.side-link:hover { background: var(--paper-3); color: var(--ink); }

/* Pending-approval banner */
.pending-banner {

/* ─── Sent-vs-draft version mismatch ────────────────────── */
.version-warning {

/* Designer-note inline (for Round 3 prototype) */
.dn-inline {

<script type="text/babel">
const { useState, useEffect } = React;

function R3App() {
  const [tweaks, setTweaks] = useState(window.TWEAK_DEFAULTS || { theme: "dark", surface: "customer", customerSub: "pure", maccSub: "good", pdfLayout: "tier_table" });
  const [showPanel, setShowPanel] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme || "dark");
  }, [tweaks.theme]);

  const setTweak = (k, v) => setTweaks(prev => {
    const next = typeof k === "object" ? { ...prev, ...k } : { ...prev, [k]: v };
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: typeof k === "object" ? k : { [k]: v } }, "*");
    return next;
  });

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === "__activate_edit_mode") setShowPanel(true);
      else if (e.data?.type === "__deactivate_edit_mode") setShowPanel(false);
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  return (
    <div data-screen-label={`Round 3 · ${tweaks.surface === "customer" ? "Customer view" : "Mark accepted"}`}>
      {/* Surface bar */}
      <div className="r3-surface-bar">
        <div style={{ flex: 1 }} className="row gap-3">
          <span className="crumb"><a href="Nexus Round 2.html">← Round 2 · main</a></span>
          <span className="crumb" style={{ color: "var(--ink-4)" }}>·</span>
          <span className="crumb"><a href="Nexus Round 2.5.html">Round 2.5 · multi-tier</a></span>
          <span className="crumb" style={{ color: "var(--ink-4)" }}>·</span>
          <span className="crumb"><strong>Round 3 · customer view + accept</strong></span>
        </div>
        <div className="r3-tabs">
          <button className={tweaks.surface === "customer" ? "active" : ""} onClick={() => setTweak("surface", "customer")}>
            A · Customer view
          </button>
          <button className={tweaks.surface === "macc" ? "active" : ""} onClick={() => setTweak("surface", "macc")}>
            B · Mark accepted
          </button>
        </div>
      </div>

      {tweaks.surface === "customer"
        ? <window.CustomerViewHost subState={tweaks.customerSub} setSubState={(v) => setTweak("customerSub", v)} pdfLayout={tweaks.pdfLayout || "tier_table"} setPdfLayout={(v) => setTweak("pdfLayout", v)} />
        : <window.MarkAcceptedHost subState={tweaks.maccSub} setSubState={(v) => setTweak("maccSub", v)} />
      }

      {showPanel && window.TweaksPanel && (
        <window.TweaksPanel onClose={() => { setShowPanel(false); window.parent.postMessage({ type: "__edit_mode_dismissed" }, "*"); }}>
          <window.TweakSection title="Display">
            <window.TweakRadio label="Theme" value={tweaks.theme} onChange={(v) => setTweak("theme", v)} options={[
              { value: "light", label: "Light" }, { value: "dark", label: "Dark" },
            ]} />
          </window.TweakSection>
          <window.TweakSection title="Surface">
            <window.TweakRadio label="Surface" value={tweaks.surface} onChange={(v) => setTweak("surface", v)} options={[
              { value: "customer", label: "A · Customer view" },
              { value: "macc",     label: "B · Mark accepted" },
            ]} />
          </window.TweakSection>
          {tweaks.surface === "customer" ? (
            <window.TweakSection title="Customer-view state">
              <window.TweakRadio label="State" value={tweaks.customerSub} onChange={(v) => setTweak("customerSub", v)} options={[
                { value: "pure",        label: "① Pure" },
                { value: "passThrough", label: "② Pass-through + fees" },
                { value: "partial",     label: "③ Partial" },
              ]} />
            </window.TweakSection>
          ) : (
            <window.TweakSection title="Mark-accepted state">
              <window.TweakSelect label="State" value={tweaks.maccSub} onChange={(v) => setTweak("maccSub", v)} options={[
                { value: "good",      label: "① GOOD + tier-selection" },
                { value: "bothGates", label: "② Both gates firing" },
                { value: "pending",   label: "③ Pending approval" },
                { value: "locked",    label: "④ Locked / accepted" },
              ]} />
            </window.TweakSection>
          )}
        </window.TweaksPanel>
      )}
    </div>
  );
}

window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;
ReactDOM.createRoot(document.getElementById("root")).render(<R3App />);
</script>

<script type="application/json" id="speaker-notes">[]</script>



</body></html>
