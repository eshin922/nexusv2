<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus · Pricing Reframe v1 — Path 3 hybrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="app/pricing/styles.css" />
</head>
<body>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <rect width="400" height="400" fill="oklch(0.97 0.012 85)"/>
    <g transform="translate(120 120)">
      <rect width="160" height="160" rx="20" fill="oklch(0.50 0.10 175)"/>
      <text x="80" y="105" font-family="Georgia, serif" font-size="42" font-weight="500" fill="oklch(0.97 0.012 85)" text-anchor="middle">Pricing</text>
    </g>
    <text x="200" y="332" font-family="Georgia, serif" font-size="20" fill="oklch(0.35 0.02 250)" text-anchor="middle" font-style="italic">Reframe v1</text>
  </svg>
</template>

<div id="root"></div>

<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "scenario": "post_apply"
  }/*EDITMODE-END*/;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/pricing/data.js"></script>
<script type="text/babel" src="app/pricing/pricing.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;
function Root() {
  const [tweaks, setTweaks] = useState(window.TWEAK_DEFAULTS || { theme: "light", scenario: "one_below_target" });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme || "light");
  }, [tweaks.theme]);
  const setTweak = (k, v) => setTweaks(prev => {
    const next = { ...prev, [k]: v };
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
    return next;
  });

  const scenarios = Object.entries(window.NXPR.scenarios);

  return (
    <main style={{ overflow: "hidden", minWidth: 0 }}>
      <div className="pr-state-strip">
        <span className="lbl">Scenario</span>
        {scenarios.map(([key, sc]) => (
          <button key={key}
                  className={tweaks.scenario === key ? "active" : ""}
                  onClick={() => setTweak("scenario", key)}>
            {sc.label}
          </button>
        ))}
        <span className="right">
          <a href="Nexus Round 6.2.html">← R6.2 Freight</a>
          <a href="docs/pricing-reframe-data-source-map.md">Data-source map</a>
          <a href="docs/pricing-reframe-designer-notes.md">Designer notes</a>
        </span>
      </div>

      <window.NXPRPage scenarioKey={tweaks.scenario} />
    </main>
  );
}
window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

</body>
</html>
