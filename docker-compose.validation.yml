services:
  nexus-validation-db:
    image: postgres:16-alpine
    container_name: nexus-validation-db
    environment:
      POSTGRES_USER: nexus_validation
      POSTGRES_PASSWORD: nexus_validation
      POSTGRES_DB: nexus_validation_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U nexus_validation -d nexus_validation_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - nexus-validation
    volumes:
      - nexus-validation-db-data:/var/lib/postgresql/data
    restart: "no"

networks:
  nexus-validation:
    name: nexus-validation
    # Docker Desktop for Windows suppresses host port publication when the
    # only attached network is internal. Host publication remains loopback-only.

volumes:
  nexus-validation-db-data:
    name: nexus-validation-db-data

